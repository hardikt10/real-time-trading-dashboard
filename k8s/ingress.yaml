apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-dashboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: trading-dashboard-backend
spec:
  rules:
    - host: trading-dashboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: trading-dashboard-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: trading-dashboard-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-dashboard-frontend
                port:
                  number: 80
