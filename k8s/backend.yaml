apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-dashboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-dashboard-backend
  template:
    metadata:
      labels:
        app: trading-dashboard-backend
    spec:
      containers:
        - name: backend
          image: trading-dashboard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: trading-dashboard-backend
spec:
  type: NodePort
  selector:
    app: trading-dashboard-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
