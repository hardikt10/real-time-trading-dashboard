apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-dashboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-dashboard-frontend
  template:
    metadata:
      labels:
        app: trading-dashboard-frontend
    spec:
      containers:
        - name: frontend
          image: trading-dashboard-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_UPSTREAM
              value: http://trading-dashboard-backend:8080
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: trading-dashboard-frontend
spec:
  type: NodePort
  selector:
    app: trading-dashboard-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30000
